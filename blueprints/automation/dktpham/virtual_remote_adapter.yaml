# Virtual Remote · Adapter
#
# Layer 1 of two. This is the driver: it turns whatever your hardware emits into
# a canonical vocabulary, and nothing downstream ever learns which integration
# the remote came from.
#
# You add one trigger per button gesture and label each trigger with a canonical
# gesture name. The label is the entire mapping - there are no per-model tables
# in this file, which is why it works with ZHA, Zigbee2MQTT, deCONZ, Matter,
# Thread, an ESPHome button, or an integration that does not exist yet.
#
# THE ONE RULE: every trigger must carry a canonical gesture name, either as its
# Trigger ID or as its name - see "Gesture name source" below. Unlabelled
# triggers are logged as a warning instead of silently doing nothing.
#
# Canonical vocabulary
#   buttons   b1 b2 b3 b4 b5 b6 b7 b8   (and dial)
#   gestures  short  double  triple  long  release  cw  ccw
#   composed  b1_short   b3_long   b3_release   dial_cw
#
# "long" fires when a hold begins, "release" when it ends. A remote that cannot
# report a release simply has no *_release triggers, and hold-to-repeat in the
# dispatcher is then capped by its step limit instead.

blueprint:
  name: Virtual Remote · Adapter (any button device → canonical events)
  description: >-
    Normalises any button device into canonical `virtual_remote` events, so the
    dispatcher blueprints never need to know about ZHA, Zigbee2MQTT, deCONZ or
    anything else. Add one trigger per gesture and label each one with a
    canonical name such as `b1_short`, `b2_long`, `b2_release` or `dial_cw`.
    One adapter automation per physical remote.
  domain: automation
  author: dktpham
  input:
    remote_id:
      name: Virtual remote ID
      description: >-
        A short unique slug identifying this remote, e.g. `living_room_5button`.
        The dispatcher blueprint must be given exactly the same ID. Unlike
        trigger names, this one is global - it is what tells your remotes apart
        on the event bus, so it must be unique across your whole install.
      selector:
        text:

    hardware_triggers:
      name: Hardware button events
      description: >-
        One trigger per button gesture. Use whatever your integration offers -
        a device trigger, a raw `zha_event`, an MQTT topic, a state change.
        Mix freely. Each trigger must be labelled with a canonical gesture name;
        see below for which label is read.
      selector:
        trigger:

    gesture_source:
      name: Gesture name source
      description: >-
        Where to read each trigger's canonical gesture name from.


        **Trigger ID** is the tidier option, but the blueprint form does not
        offer "Edit ID" for every trigger type. When it is missing, either switch
        that one trigger card to YAML mode (⋮ → Edit in YAML) and add
        `id: b1_short`, or use the option below instead.


        **Trigger name** reads the trigger's name (⋮ → Rename), which is
        available on every trigger type. Only pick this if you are naming your
        triggers `b1_short` rather than "Button 1 short press".


        Names are tidied up before use: trimmed, lower-cased, and spaces turned
        into underscores, so "B1 Short" also works.
      default: id
      selector:
        select:
          options:
            - label: "Trigger ID (⋮ → Edit ID, or YAML mode)"
              value: id
            - label: "Trigger name (⋮ → Rename)"
              value: alias

    value_template:
      name: Value passthrough (advanced, optional)
      description: >-
        Attaches a `value` to every emitted event - intended for dials, where
        rotation magnitude or step size matters. Leave empty unless you need it.
        This template runs on EVERY gesture, so it must never raise: guard it
        with `default`, e.g.
        `{{ trigger.event.data.args[0] | default(0) }}`.
      default: ""
      selector:
        text:

# parallel so a burst of presses is never dropped; the dispatcher decides what
# to do about overlap, not the adapter.
mode: parallel
max: 25
max_exceeded: silent

# Spliced in verbatim. Assigned at the top level rather than wrapped in a
# `- triggers:` item, because the flattener in Home Assistant only unwraps a
# wrapper dict that contains the `triggers` key and nothing else.
triggers: !input hardware_triggers

variables:
  remote_id: !input remote_id
  gesture_source: !input gesture_source
  # The whole mapping, in one expression: the trigger's own label *is* the
  # gesture. `trigger.alias` is None when unset; `trigger.id` instead falls back
  # to the trigger's position ("0", "1", ...), which the guard below catches.
  gesture: >-
    {%- set raw = trigger.alias if gesture_source == 'alias' else trigger.id -%}
    {{ (raw | default('', true)) | string | trim | lower | replace(' ', '_') }}

actions:
  - choose:
      # An unlabelled trigger would otherwise emit a gesture of "0" or "1" and
      # silently match nothing in the dispatcher. Say so loudly instead - this
      # is by far the most common setup mistake.
      - alias: Guard · trigger has no canonical gesture name
        conditions: "{{ gesture == '' or gesture | regex_match('^[0-9]+$') }}"
        sequence:
          - action: system_log.write
            data:
              level: warning
              logger: virtual_remote
              message: >-
                Adapter '{{ remote_id }}': a trigger fired without a canonical
                gesture name, so it was ignored (resolved to '{{ gesture }}').
                {% if gesture_source == 'id' -%}
                Set that trigger's ID to a gesture name such as 'b1_short' -
                ⋮ → Edit ID, or ⋮ → Edit in YAML and add `id: b1_short`.
                {%- else -%}
                Rename that trigger to a gesture name such as 'b1_short'.
                {%- endif %}

    default:
      - alias: Emit the canonical event
        event: virtual_remote
        event_data:
          remote: !input remote_id
          gesture: "{{ gesture }}"
          value: !input value_template
